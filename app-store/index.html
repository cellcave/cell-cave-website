<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>App Store | Cell Cave</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;

            font-family: Arial, sans-serif;

            background: #f6f7f4;
            color: #171916;
        }

        .container {
            width: 100%;
            max-width: 620px;

            padding: 55px 35px;

            text-align: center;

            background: white;

            border: 1px solid #e3e6df;
            border-radius: 28px;

            box-shadow: 0 20px 60px rgba(30, 40, 30, 0.08);
        }

        .icon {
            width: 76px;
            height: 76px;

            display: grid;
            place-items: center;

            margin: 0 auto 28px;

            border-radius: 22px;

            background: #171916;
            color: white;

            font-size: 22px;
            font-weight: bold;
        }

        .label {
            margin-bottom: 14px;

            color: #426b4d;

            font-size: 12px;
            font-weight: bold;

            text-transform: uppercase;
            letter-spacing: 1px;
        }

        h1 {
            margin-bottom: 18px;

            font-size: 42px;
            line-height: 1.1;
        }

        p {
            max-width: 500px;

            margin: 0 auto 30px;

            color: #6c7169;

            font-size: 16px;
            line-height: 1.8;
        }

        .back {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-height: 48px;
            padding: 0 22px;

            border-radius: 12px;

            background: #171916;
            color: white;

            text-decoration: none;

            font-size: 14px;
            font-weight: bold;
        }

        .back:hover {
            background: #426b4d;
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="icon">
            
        </div>

        <div class="label">
            Cell Cave
        </div>

        <h1>
            Coming Soon to the App Store
        </h1>

        <p>
            We're working to bring Cell Cave apps to the App Store.
            Our apps are currently available on Google Play, and
            we're preparing to make them available for iPhone and
            iPad users as well.
        </p>

        <a href="../" class="back">
            ← Back to Cell Cave
        </a>

    </main>

</body>
</html>
